<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>OMNI-ODYSSEY</title>
<style>
  :root{ --ink:#f3f0ff; --glow:#7cc4ff; --pick:#ffd166; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;color:var(--ink);
    font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:600px;height:600px}
  #scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease;background:#0a0b14}
  #intro{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none;z-index:6}
  #vignette{position:absolute;inset:0;background:
    radial-gradient(120% 80% at 50% 30%, transparent 40%, rgba(0,0,0,.35) 100%),
    linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 22%, transparent 48%)}
  #title{position:absolute;top:14px;left:0;right:0;text-align:center;letter-spacing:3px;font-size:13px;
    font-weight:700;color:rgba(255,255,255,.78);text-shadow:0 1px 6px #000}
  #beat{position:absolute;top:22px;right:18px;font-size:11px;color:rgba(255,255,255,.6);text-shadow:0 1px 4px #000}
  #caption{position:absolute;left:28px;right:28px;bottom:148px;font-size:19px;font-weight:600;
    text-shadow:0 2px 10px #000,0 0 2px #000;line-height:1.35}
  #choices{position:absolute;left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;
    background:rgba(18,22,40,.62);border:1.5px solid rgba(124,196,255,.28);backdrop-filter:blur(6px);
    color:var(--ink);font-size:16px;font-weight:600;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .choice .dot{width:9px;height:9px;border-radius:50%;background:var(--glow);opacity:.5;box-shadow:0 0 10px var(--glow);flex:none}
  .choice.active{border-color:var(--pick);box-shadow:0 0 22px rgba(255,209,102,.5),inset 0 0 18px rgba(255,209,102,.12);transform:translateX(6px) scale(1.02)}
  .choice.active .dot{background:var(--pick);opacity:1;box-shadow:0 0 14px var(--pick)}
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:rgba(4,6,14,.78);z-index:5}
  #loading.on{display:flex}
  #orb{width:64px;height:64px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--glow),#b388ff,var(--glow));filter:blur(1px);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadtxt{font-size:15px;color:rgba(255,255,255,.85);letter-spacing:1px}
  #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.42)}
  /* begin gate (gesture unlocks the cinematic's audio) */
  #begin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;
    background:radial-gradient(80% 60% at 50% 40%, #161a2e, #05060c);z-index:8}
  #begin h1{font-size:34px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg,var(--glow),#b388ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(124,196,255,.25)}
  #begin .cta{font-size:15px;color:var(--pick);letter-spacing:1px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>
<body>
  <div id="stage">
    <img id="scene" alt="">
    <video id="intro" playsinline preload="auto"></video>
    <div id="vignette"></div>
    <div id="title">OMNI · ODYSSEY</div>
    <div id="beat"></div>
    <div id="caption">The world is forming…</div>
    <div id="choices"></div>
    <div id="loading"><div id="orb"></div><div id="loadtxt">the agents are painting your world…</div></div>
    <div id="hint">Neural Band — swipe ◀ ▶ to choose · pinch / Enter to commit</div>
    <div id="begin"><h1>OMNI&nbsp;ODYSSEY</h1><div class="cta">✦ pinch / Enter to begin ✦</div></div>
  </div>

<script>
(function(){
  const els = {
    scene: document.getElementById('scene'),
    intro: document.getElementById('intro'),
    begin: document.getElementById('begin'),
    caption: document.getElementById('caption'),
    choices: document.getElementById('choices'),
    beat: document.getElementById('beat'),
    loading: document.getElementById('loading'),
  };
  let state = 'init';                  // init | intro | play
  let choices = [], active = 0, seq = -1, committing = false, looping = false;

  function renderChoices(){
    els.choices.innerHTML = '';
    choices.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'choice' + (i === active ? ' active' : '');
      el.innerHTML = '<span class="dot"></span><span>' + (c.label || c) + '</span>';
      el.addEventListener('click', () => { active = i; commit(); });
      els.choices.appendChild(el);
    });
  }
  function setActive(i){
    if (!choices.length) return;
    active = (i + choices.length) % choices.length;
    [...els.choices.children].forEach((el, idx) => el.classList.toggle('active', idx === active));
  }

  async function load(){
    try{
      const d = await (await fetch('/scene-data')).json();
      els.loading.classList.toggle('on', !!d.generating);
      if (d.seq === seq) return;
      seq = d.seq;
      if (d.hasImage) els.scene.src = '/scene-image?seq=' + seq;
      els.caption.textContent = d.caption || '';
      els.beat.textContent = d.index ? ('chapter ' + d.index) : '';
      choices = d.choices || []; active = 0;
      renderChoices();
      committing = false;
    }catch(_){}
  }
  async function commit(){
    if (committing || !choices.length) return;
    committing = true; els.loading.classList.add('on');
    try{ await fetch('/choose', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({index: active})}); }
    catch(_){ committing = false; els.loading.classList.remove('on'); }
  }

  // --- opening cinematic (Veo) → gesture-gated so its audio can play ---
  function startPlay(){
    if (state === 'play') return;
    state = 'play';
    try{ els.intro.pause(); }catch(_){}
    els.intro.style.display = 'none';
    if (!looping){ looping = true; load(); setInterval(load, 1400); }
  }
  function startIntro(){
    if (state !== 'init') return;
    state = 'intro';
    els.begin.style.display = 'none';
    els.intro.muted = true;            // muted autoplay is allowed WITHOUT a gesture → reliable on-glasses
    els.intro.setAttribute('playsinline','');
    els.intro.style.display = 'block';
    els.intro.src = '/scene-video';
    els.intro.onended = startPlay;
    els.intro.onerror = startPlay;     // no clip / can't decode → straight to the story
    const p = els.intro.play();
    if (p && p.catch) p.catch(() => startPlay());
    setTimeout(() => { if (state === 'intro') startPlay(); }, 11000);  // hard cap (8s clip + buffer)
  }

  // --- Neural Band (arrows = swipe, Enter/pinch = commit) ---
  document.addEventListener('keydown', (e) => {
    if (state === 'intro'){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startPlay(); } return; } // skip cinematic
    if (state !== 'play') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); commit(); }
  });
  document.addEventListener('click', () => { if (state === 'intro') startPlay(); });   // tap anywhere to skip the cinematic
  startIntro();   // auto-play the opening cinematic (muted) on load, then the story
})();
</script>
</body>
</html>
