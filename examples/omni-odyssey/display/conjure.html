<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OMNI-ODYSSEY · Conjure a Monster</title>
<style>
  :root{ --ink:#f3f0ff; --glow:#7cc4ff; --pick:#ffd166; --panel:rgba(18,22,40,.66); --line:rgba(124,196,255,.28); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(90% 60% at 50% 0%, #161a2e, #05060c);color:var(--ink);
    font:16px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:22px 16px 40px}
  header{text-align:center;margin-bottom:18px}
  h1{font-size:24px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--glow),#b388ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:#9aa3c7;font-size:13px;margin-top:4px}
  form{max-width:520px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(6px)}
  label{display:block;font-size:12px;color:#9aa3c7;text-transform:uppercase;letter-spacing:1px;margin:6px 2px}
  textarea,input{width:100%;background:#0c0f1d;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);
    font:inherit;padding:12px 14px;resize:none}
  textarea{min-height:88px}
  textarea:focus,input:focus{outline:none;border-color:var(--glow);box-shadow:0 0 16px rgba(124,196,255,.25)}
  button{width:100%;margin-top:14px;padding:15px;border:none;border-radius:14px;font:inherit;font-weight:800;letter-spacing:1px;
    color:#10131f;background:linear-gradient(90deg,var(--pick),#ffb04d);cursor:pointer}
  button:disabled{opacity:.5}
  #status{max-width:520px;margin:12px auto 0;text-align:center;min-height:22px;color:var(--pick);font-weight:600}
  h2{max-width:520px;margin:26px auto 10px;font-size:13px;color:#9aa3c7;text-transform:uppercase;letter-spacing:1.5px}
  #gallery{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
  .card .img{aspect-ratio:1/1;background:#0c0f1d center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#7f88ad}
  .card .img.loading{color:#7f88ad;font-size:12px;letter-spacing:1px}
  .card .meta{padding:8px 10px}
  .card .nm{font-weight:700;font-size:13px;line-height:1.25}
  .card .by{font-size:11px;color:#9aa3c7;margin-top:2px}
</style>
</head>
<body>
  <header>
    <h1>CONJURE A MONSTER</h1>
    <div class="sub">Describe a creature — it will be painted by Gemini and stalk the live OMNI-ODYSSEY adventure on the glasses.</div>
  </header>

  <form id="f">
    <label for="d">Describe your monster</label>
    <textarea id="d" maxlength="280" placeholder="e.g. a three-headed crystalline fox wreathed in aurora light, with antlers of glass…" required></textarea>
    <label for="by">Your name (optional)</label>
    <input id="by" maxlength="40" placeholder="shown when your monster appears">
    <button id="go" type="submit">✦ Conjure ✦</button>
  </form>
  <div id="status"></div>

  <h2>The Bestiary</h2>
  <div id="gallery"></div>

<script>
  const f = document.getElementById('f'), d = document.getElementById('d'), by = document.getElementById('by');
  const go = document.getElementById('go'), status = document.getElementById('status'), gallery = document.getElementById('gallery');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const description = d.value.trim(); if (!description) return;
    go.disabled = true; status.textContent = 'Conjuring…';
    try{
      const r = await fetch('/conjure', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ description, by: by.value.trim() }) });
      const j = await r.json();
      if (j.ok){ status.textContent = '✨ "' + (j.name || description) + '" is being conjured — watch for it in the Odyssey!'; d.value=''; refresh(); }
      else { status.textContent = j.error || 'Something went wrong.'; }
    }catch(_){ status.textContent = 'Network error — try again.'; }
    go.disabled = false;
  });

  async function refresh(){
    try{
      const j = await (await fetch('/monsters')).json();
      const list = (j.monsters||[]).slice().reverse();
      gallery.innerHTML = '';
      for (const m of list){
        const card = document.createElement('div'); card.className='card';
        const img = document.createElement('div'); img.className = 'img' + (m.hasImage ? '' : ' loading');
        if (m.hasImage) img.style.backgroundImage = 'url(/monster-image?id=' + encodeURIComponent(m.id) + ')';
        else img.textContent = m.status === 'failed' ? 'gen failed' : 'conjuring…';
        const meta = document.createElement('div'); meta.className='meta';
        meta.innerHTML = '<div class="nm"></div><div class="by"></div>';
        meta.querySelector('.nm').textContent = m.name || m.description || 'monster';
        meta.querySelector('.by').textContent = 'by ' + (m.by || 'anon');
        card.appendChild(img); card.appendChild(meta); gallery.appendChild(card);
      }
    }catch(_){}
  }
  refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
